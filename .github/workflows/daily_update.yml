name: Daily Comunio data update

# Täglich um 10:00 UTC (= 12:00 MESZ, 11:00 MEZ). Zeitzonen-konvertiert
# wird nicht — GitHub-Actions-Cron läuft auf UTC. Falls du strikt 10:00
# lokale Zeit brauchst, ändere den Cron auf '0 8 * * *' (UTC) für 10:00
# MESZ im Winter oder behalte 10 UTC (= 12 MESZ im Sommer).

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    # Manueller Trigger über GitHub UI: Actions → Daily Comunio data
    # update → Run workflow. Praktisch zum Testen ohne auf den Timer
    # zu warten.

jobs:
  update:
    runs-on: ubuntu-latest
    # refresh_players macht ~800 Spieler × 4 sequenzielle API-Calls. Auf einer
    # langsamen Runner-Kiste kann das gut 20–40 min dauern; mit
    # refresh_news (~5 Pages) bleibt noch Reserve. 90 min gibt komfortablen
    # Puffer, ohne sich an die Obergrenze von 360 min heranzutrauen.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: comunio_datenverarbeitung
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily update
        working-directory: comunio_datenverarbeitung
        env:
          # Diese Secrets legst du in
          # GitHub → Repo → Settings → Secrets and variables → Actions
          # an. NICHT ins Repo committen.
          MONGO_URI: ${{ secrets.MONGO_URI }}
          COMUNIO_USERNAME: ${{ secrets.COMUNIO_USERNAME }}
          COMUNIO_PASSWORD: ${{ secrets.COMUNIO_PASSWORD }}
        run: |
          python cron_update.py --continue-on-error

      - name: Audit ownership-vs-transfers
        # Liest nur aus der DB, schreibt nichts — fängt Fälle ab, in denen
        # ein Spieler im aktuellen Comunio-Besitz ist, aber keine offene
        # Buy-Zeile in Transfers existiert (z.B. weil ein Run teilweise
        # fehlschlug). Exit-Code != 0 lässt die Action visuell auffällig
        # werden, ohne den Lauf als Ganzes zu failen.
        working-directory: comunio_datenverarbeitung
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          if [ -f audit_owners.py ]; then
            python audit_owners.py || echo "::warning::ownership-vs-transfers audit reported issues"
          fi
