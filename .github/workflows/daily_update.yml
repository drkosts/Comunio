name: Daily Comunio data update

# Täglich um 07:00 UTC (= 09:00 MESZ, 08:00 MEZ). Falls du strikt 10:00
# lokale Zeit brauchst, ändere den Cron auf '0 8 * * *' (UTC) für 10:00
# MESZ im Winter oder behalte '0 7 * * *' (= 09 MESZ im Sommer).

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    # Manueller Trigger über GitHub UI: Actions → Daily Comunio data
    # update → Run workflow. Praktisch zum Testen ohne auf den Timer
    # zu warten.

jobs:
  update:
    runs-on: ubuntu-latest
    # refresh_players macht ~800 Spieler × 4 sequenzielle API-Calls. Auf einer
    # langsamen Runner-Kiste kann das gut 20–40 min dauern; mit
    # refresh_news (~5 Pages) bleibt noch Reserve. 90 min gibt komfortablen
    # Puffer, ohne sich an die Obergrenze von 360 min heranzutrauen.
    timeout-minutes: 90

    # Das GitHub-Repo IST der comunio_datenverarbeitung/-Ordner (siehe
    # Repo-Root: app.py, cron_update.py, update_jobs.py etc.). Nach
    # checkout liegt alles direkt unter $GITHUB_WORKSPACE — kein
    # working-directory-Subfolder nötig.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily update
        env:
          # Diese Secrets legst du in
          # GitHub → Repo → Settings → Secrets and variables → Actions
          # an. NICHT ins Repo committen.
          MONGO_URI: ${{ secrets.MONGO_URI }}
          COMUNIO_USERNAME: ${{ secrets.COMUNIO_USERNAME }}
          COMUNIO_PASSWORD: ${{ secrets.COMUNIO_PASSWORD }}
          AUDIT_SEASON: "2026/2027"
        run: |
          # Nur Player-Marktwerte. Transfer-News wird separat stündlich
          # durch .github/workflows/hourly_transfers.yml aktualisiert.
          # Begründung: Mitspieler-Transfers passieren den ganzen Tag,
          # FROM_COMPUTER-Buys nur morgens; ein stündlicher Transfer-Lauf
          # deckt beides ab.
          python cron_update.py --only players --continue-on-error

      - name: Refresh season bonuses
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          COMUNIO_USERNAME: ${{ secrets.COMUNIO_USERNAME }}
          COMUNIO_PASSWORD: ${{ secrets.COMUNIO_PASSWORD }}
          AUDIT_SEASON: "2026/2027"
        run: |
          # Matchday-Werte ändern sich nur einmal pro Woche. Ein täglicher
          # Lauf reicht; ist idempotent (Unique-Index), frischt ggf.
          # korrigierte Beträge auf.
          python cron_update.py --only bonuses --continue-on-error

      - name: Audit ownership-vs-transfers
        # Liest nur aus der DB, schreibt nichts — fängt Fälle ab, in denen
        # ein Spieler im aktuellen Comunio-Besitz ist, aber keine offene
        # Buy-Zeile in Transfers existiert (z.B. weil ein Run teilweise
        # fehlschlug). Exit-Code != 0 lässt die Action visuell auffällig
        # werden, ohne den Lauf als Ganzes zu failen.
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          AUDIT_SEASON: "2026/2027"
        run: |
          if [ -f audit_owners.py ]; then
            python audit_owners.py || echo "::warning::ownership-vs-transfers audit reported issues"
          fi